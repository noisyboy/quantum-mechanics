<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Pictures Visualization</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            text-align: center;
        }
        .control-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .control-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        #canvas-wrapper {
            width: 500px;
            height: 500px;
            border: 2px solid #333;
            background-color: #fafafa;
            position: relative;
        }
        #visualization-canvas {
            width: 100%;
            height: 100%;
        }
        .hud {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 6px;
            text-align: right;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="control-group">
            <label for="quantum-picture">Choose Quantum Picture:</label>
            <select id="quantum-picture">
                <option value="Schrodinger">Schrödinger (States Evolve)</option>
                <option value="Heisenberg">Heisenberg (Operators Evolve)</option>
                <option value="Interaction">Interaction (Dirac - Hybrid)</option>
            </select>
        </div>

        <div id="canvas-wrapper">
            <canvas id="visualization-canvas" width="500" height="500"></canvas>
            <div class="hud" id="hud-display">
                Picture: Schrödinger<br>
                Ω_state: 1.0 rad/s<br>
                Ω_obs: 0.0 rad/s
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visualization-canvas');
        const ctx = canvas.getContext('2d');
        const hudDisplay = document.getElementById('hud-display');
        const pictureSelect = document.getElementById('quantum-picture');

        // Simulation parameters
        const cx = 250; // Center X
        const cy = 250; // Center Y
        const radius = 200;
        const w0 = 0.8; // H_0 angular velocity (fast)
        const v = 0.15; // V(t) perturbation velocity (slow)
        const w_total = w0 + v; // Total angular velocity

        let currentPicture = "Schrodinger";
        let startTime = Date.now();

        // Update parameters based on selection
        pictureSelect.addEventListener('change', function() {
            currentPicture = this.value;
            startTime = Date.now(); // Reset time to sync phases
        });

        function draw() {
            // Calculate elapsed time in seconds
            const time = (Date.now() - startTime) / 1000;

            // Clear canvas
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Determine velocities based on the picture
            let stateVel, obsVel, obsAngle;

            switch (currentPicture) {
                case "Schrodinger":
                    stateVel = w_total;
                    obsVel = 0;
                    obsAngle = 0;
                    break;
                case "Heisenberg":
                    stateVel = 0;
                    obsVel = -w_total; // Operators rotate back
                    obsAngle = time * obsVel;
                    break;
                case "Interaction":
                    stateVel = v;      // State vector rotates slowly
                    obsVel = -w0;     // Observable axes rotate back at w0
                    obsAngle = time * obsVel;
                    break;
            }

            // Calculate state vector angle
            const stateAngle = time * stateVel;

            // Update the HUD
            hudDisplay.innerHTML = `
                Picture: ${currentPicture}<br>
                Ω_state: ${stateVel.toFixed(2)} rad/s<br>
                Ω_obs: ${obsVel.toFixed(2)} rad/s
            `;

            // --- Draw Observable Axes (X/Y) ---
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(obsAngle);

            // X-axis
            ctx.beginPath();
            ctx.moveTo(-radius, 0);
            ctx.lineTo(radius, 0);
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.stroke();
            // Arrow head
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(radius-10, -5);
            ctx.lineTo(radius-10, 5);
            ctx.closePath();
            ctx.fillStyle = '#999';
            ctx.fill();
            // Label
            ctx.fillStyle = '#333';
            ctx.font = '16px monospace';
            ctx.fillText("X", radius + 10, 5);

            // Y-axis
            ctx.beginPath();
            ctx.moveTo(0, radius);
            ctx.lineTo(0, -radius);
            ctx.strokeStyle = '#999';
            ctx.stroke();
            // Arrow head
            ctx.beginPath();
            ctx.moveTo(0, -radius);
            ctx.lineTo(-5, -radius+10);
            ctx.lineTo(5, -radius+10);
            ctx.closePath();
            ctx.fill();
            // Label
            ctx.fillText("Y", -5, -radius - 15);

            ctx.restore(); // Restore to center


            // --- Draw State Vector (|ψ>) ---
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-stateAngle); // Standard rotation

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(radius, 0);
            ctx.strokeStyle = '#007bff'; // Blue
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Draw vector head
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(radius-15, -7);
            ctx.lineTo(radius-15, 7);
            ctx.closePath();
            ctx.fillStyle = '#007bff';
            ctx.fill();

            // Add text label
            ctx.fillStyle = '#007bff';
            ctx.font = 'bold 20px serif';
            ctx.fillText("|ψ⟩", radius + 15, 7);

            ctx.restore();

            requestAnimationFrame(draw);
        }

        // Start animation loop
        requestAnimationFrame(draw);
    </script>
</body>
</html>
